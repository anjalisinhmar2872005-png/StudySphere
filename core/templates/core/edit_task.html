<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - StudySphere</title>
</head>
<body>

<h1>✏️ Edit Task</h1>

<form method="POST">
    {% csrf_token %}

    <label>Task Title:</label><br>
    <input type="text" name="title" value="{{ task.title }}" required>
    <br><br>

    <label>Subject:</label><br>
    <select name="subject" required>
        {% for subject in subjects %}
            <option value="{{ subject.id }}"
                {% if subject.id == task.subject.id %}selected{% endif %}>
                {{ subject.subject_name }}
            </option>
        {% endfor %}
    </select>
    <br><br>

    <label>Topic:</label><br>
    <select name="topic" required>
        {% for topic in topics %}
            <option value="{{ topic.id }}"
                {% if topic.id == task.topic.id %}selected{% endif %}>
                {{ topic.topic_name }}
            </option>
        {% endfor %}
    </select>
    <br><br>

    <label>Due Date:</label><br>
    <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}" required>
    <br><br>

    <label>Priority:</label><br>
    <select name="priority">
        <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>
        <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>
        <option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
    </select>
    <br><br>

    <label>Status:</label><br>
    <select name="status">
        <option value="Pending" {% if task.status == "Pending" %}selected{% endif %}>Pending</option>
        <option value="In Progress" {% if task.status == "In Progress" %}selected{% endif %}>In Progress</option>
        <option value="Completed" {% if task.status == "Completed" %}selected{% endif %}>Completed</option>
    </select>
    <br><br>

    <label>Description:</label><br>
    <textarea name="description">{{ task.description }}</textarea>
    <br><br>

    <button type="submit">Save Changes</button>
</form>

<br>

<a href="{% url 'tasks' %}">← Back to Tasks</a>

</body>
</html>
