<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Goal - StudySphere</title>
</head>
<body>

    <h1>✏️ Edit Goal</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Goal Title:</label><br>
        <input type="text" name="title" value="{{ goal.title }}" required>
        <br><br>

        <label>Description:</label><br>
        <textarea name="description">{{ goal.description }}</textarea>
        <br><br>

        <label>Target Date:</label><br>
        <input type="date" name="target_date" value="{{ goal.target_date|date:'Y-m-d' }}" required>
        <br><br>

        <label>Priority:</label><br>
        <select name="priority">
            <option value="Low" {% if goal.priority == "Low" %}selected{% endif %}>Low</option>
            <option value="Medium" {% if goal.priority == "Medium" %}selected{% endif %}>Medium</option>
            <option value="High" {% if goal.priority == "High" %}selected{% endif %}>High</option>
        </select>
        <br><br>

        <label>Progress (%):</label><br>
        <input type="number" name="progress" min="0" max="100" value="{{ goal.progress }}">
        <br><br>

        <label>Status:</label><br>
        <select name="status">
            <option value="Active" {% if goal.status == "Active" %}selected{% endif %}>Active</option>
            <option value="Completed" {% if goal.status == "Completed" %}selected{% endif %}>Completed</option>
        </select>
        <br><br>

        <button type="submit">Update Goal</button>
    </form>

    <br>

    <a href="{% url 'goals' %}">← Back to Goals</a>

</body>
</html>
