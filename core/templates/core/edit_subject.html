<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Subject - StudySphere</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        a {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Subject</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Subject Name</label>
            <input
                type="text"
                name="subject_name"
                value="{{ subject.subject_name }}"
                required
            >

            <label>Subject Code</label>
            <input
                type="text"
                name="subject_code"
                value="{{ subject.subject_code }}"
            >

            <label>Semester</label>
            <input
                type="number"
                name="semester"
                value="{{ subject.semester }}"
                required
            >

            <label>Description</label>
            <textarea name="description">{{ subject.description }}</textarea>

            <div class="buttons">

                <button type="submit">
                    💾 Save Changes
                </button>

                <a href="{% url 'subjects' %}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
